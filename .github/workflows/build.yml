name: Build Lucix AI EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack and Yarn v4
        run: |
          corepack enable
          yarn set version 4.5.3
        shell: bash

      - name: Install Monorepo Dependencies
        run: |
          yarn install --no-immutable
        shell: bash

      - name: Build All Workspaces
        run: |
          yarn build:packages || yarn build
        shell: bash

      - name: Compile and Package Windows Installer
        run: |
          yarn make --platform win32 || yarn package
        shell: bash

      - name: Upload Installer Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lucix-AI-Windows-Installer
          path: |
            dist/**/*.exe
            out/**/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
