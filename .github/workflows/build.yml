name: Build Lucix AI EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Force Fix Yarn Version Conflict
        run: |
          npm install -g corepack --force
          corepack enable
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate Project Yarn Version
        run: |
          corepack prepare yarn@4.5.3 --activate
        shell: bash

      - name: Install Desktop Dependencies
        run: |
          yarn install --no-immutable
        shell: bash

      - name: Build Tauri Desktop Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0
          releaseName: 'Lucix AI v1.0.0'
          releaseBody: 'Downloadable setup for Lucix AI desktop workspace.'
          includeRelease: true

      - name: Upload Installer Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lucix-AI-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          
