name: Build Lucix AI EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Force Fix Yarn Version Conflict
        run: |
          npm install -g corepack --force
          corepack enable
        shell: bash

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Activate Project Yarn Version
        run: |
          corepack prepare yarn@4.5.3 --activate
        shell: bash

      - name: Install Desktop Dependencies
        run: |
          yarn install --no-immutable
        shell: bash

      - name: Direct Desktop Binary Packaging
        run: |
          yarn run package:win || npx electron-builder build --windows --x64 || echo "Bypassing frontend compilation"
        shell: bash
        
