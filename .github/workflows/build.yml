name: Build Lucix AI EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true  # Resolves the Node.js 20 runner deprecation error
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24  # Upgrades target environment to fully support Corepack natively

      - name: Enable Corepack and Setup Yarn 4
        run: |
          corepack enable
          corepack prepare yarn@4.5.3 --activate
        shell: bash

      - name: Install Desktop Dependencies
        run: |
          yarn config set YARN_ENABLE_IMMUTABLE_INSTALLS false
          yarn install
        shell: bash

      - name: Build Tauri Desktop Installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v1.0.0
          releaseName: 'Lucix AI v1.0.0'
          releaseBody: 'Downloadable setup for Lucix AI desktop workspace.'
          includeRelease: true

      - name: Upload Installer Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lucix-AI-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          
