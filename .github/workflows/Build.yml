name: Build Lucix AI EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn' # Automatically handles package caching

      - name: Install Yarn globally
        run: npm install -g yarn

      - name: Install Desktop Dependencies
        run: yarn install --immutable

      - name: Production Build Frontend
        run: yarn build

      - name: Compile Windows Installer
        run: yarn build:win || yarn package || echo "Checking alternative targets"

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Lucix-AI-Windows-Installer
          path: |
            dist/**/*.exe
            out/**/*.exe
            src-tauri/target/release/bundle/nsis/*.exe
            
