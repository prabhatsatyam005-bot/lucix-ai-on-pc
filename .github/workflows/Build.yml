name: Build Lucix AI EXE
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true # Updates the runner to Node 24
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22 # Fixed: changed from node-size to node-version

      - name: Install Dependencies
        run: |
          npm install --legacy-peer-deps

      - name: Package Windows EXE
        run: |
          npm run package || npm run build
          
